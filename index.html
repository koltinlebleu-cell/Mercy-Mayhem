<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercy Mayhem</title><style>body{font-family:system-ui;background:#111827;color:white;text-align:center;margin:0;padding:20px}button,input{font:inherit;padding:12px;margin:5px;border-radius:9px;border:0}button{background:#f59e0b;cursor:pointer}.card{display:inline-flex;width:65px;height:105px;border:3px solid white;border-radius:12px;margin:5px;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:white;cursor:pointer}.red{background:#dc2626}.blue{background:#2563eb}.green{background:#16a34a}.yellow{background:#ca8a04}.wild{background:linear-gradient(145deg,#f97316,#7c3aed 42%,#06b6d4 78%,#eab308);box-shadow:0 0 14px #a855f788;border-color:#fde68a}.card{position:relative;flex-direction:column;gap:3px;box-shadow:0 5px 12px #0007;text-shadow:0 2px 3px #0008}.card .symbol{font-size:32px;line-height:1}.card .small{font-size:12px;letter-spacing:.6px}.card.special{border-width:4px;transform:rotate(-1deg)}.player.active{border:3px solid #fbbf24;background:#78350f;box-shadow:0 0 12px #f59e0b88}#turn{font-size:22px;font-weight:800;color:#fde68a;margin:16px auto}#setup{max-width:400px;margin:auto}#setup input{max-width:80%;box-sizing:border-box}#connection{color:#86efac}#actions button{margin:7px}.player{display:inline-block;padding:10px;margin:5px;border:1px solid #64748b;border-radius:8px}#hand{display:flex;flex-wrap:wrap;justify-content:center}</style></head><body><h1>⚡ Mercy Mayhem</h1><p id="connection">Connecting…</p><p style="font-size:13px;color:#9ca3af">Install: iPhone Safari → Share → Add to Home Screen. Android Chrome → Install app.</p><div id="setup"><input id="name" placeholder="Your nickname"><button onclick="createRoom()">Create room</button><input id="code" placeholder="Room code"><button onclick="joinRoom()">Join room</button></div><h2 id="room"></h2><div id="turn" aria-live="polite"></div><div id="players"></div><div id="table"></div><div id="hand"></div><div id="actions"></div><script src="/socket.io/socket.io.js"></script><script>const socket=io();socket.on("connect",()=>document.getElementById("connection").textContent="● Connected");socket.on("disconnect",()=>document.getElementById("connection").textContent="○ Offline — reconnecting");if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});let me='',state=null;const $=id=>document.getElementById(id);function createRoom(){if(!socket.connected)return alert('Waiting for server connection');socket.emit('create',{name:$('name').value||'Player'},r=>{me=r.id;$('setup').style.display='none';$('room').innerHTML='Private room: <strong>'+r.code+'</strong> <button onclick="copyCode()">Copy code</button>';});}function joinRoom(){if(!socket.connected)return alert('Waiting for server connection');socket.emit('join',{name:$('name').value||'Player',code:$('code').value.toUpperCase()},r=>{if(r.error)return alert(r.error);me=r.id;$('setup').style.display='none';$('room').innerHTML='Private room: <strong>'+r.code+'</strong> <button onclick="copyCode()">Copy code</button>';});}function copyCode(){navigator.clipboard?.writeText(state?.code||$('room').textContent.match(/[A-F0-9]{6}/)?.[0]||'').then(()=>alert('Room code copied')).catch(()=>alert('Select the room code to copy it'));}socket.on('roomClosed',()=>{alert('Host closed the room');location.reload()});function send(a){socket.emit('action',a,r=>{if(r.error)alert(r.error);});}function label(c){return c.type==='number'?c.value:({draw2:'+2',draw4:'+4',draw6:'+6',draw10:'+10',reverse4:'↩+4',reverse:'↩',skip:'⊘',skipall:'⊘ALL',discard:'ALL',roulette:'🎲'})[c.type]}function cardArt(c){const data={number:['✦',String(c.value)],draw2:['⇈','DRAW +2'],draw4:['⚡','DRAW +4'],draw6:['⚡','DRAW +6'],draw10:['💥','DRAW +10'],reverse4:['↶','REVERSE +4'],reverse:['↶','REVERSE'],skip:['⊘','SKIP'],skipall:['⛔','SKIP ALL'],discard:['✹','DISCARD'],roulette:['🎲','ROULETTE']};const a=data[c.type]||['✦','SPECIAL'];return '<span class="symbol">'+(c.type==='number'?c.value:a[0])+'</span><span class="small">'+(c.type==='number'?'MERCY MAYHEM':a[1])+'</span>';}function color(){return prompt('Choose wild color: red, yellow, green, blue','red')?.toLowerCase()}socket.on('state',g=>{state=g;if(g.lobby){$('turn').textContent='Waiting for players • '+g.lobby.length+'/10';$('players').textContent=g.lobby.join(' • ');$('actions').innerHTML=me==='0'?'<button onclick="socket.emit(\'start\',r=>r.error&&alert(r.error))">Start game</button>':'Waiting for host';return;}$('setup').style.display='none';const active=g.players[g.turn];$('turn').textContent=g.winner?'🏆 Game over':active.id===me?'⭐ YOUR TURN!':'🎯 '+active.name+'’s turn';$('players').innerHTML=g.players.map(p=>`<span class="player ${active.id===p.id?'active':''}">${p.name.replaceAll('<','&lt;')} (${p.count}) ${p.out?'OUT':''} ${active.id===p.id?'◀ PLAYING':''}</span>`).join('');$('table').innerHTML=`<h2>${g.winner?'Winner: '+g.players.find(p=>p.id===g.winner).name:'Current color: '+g.color}</h2><div class="card ${g.discard[0].color||'wild'} ${g.discard[0].type!=='number'?'special':''}">${cardArt(g.discard[0])}</div><p>Draw stack: ${g.pending}</p>`;$('hand').innerHTML='';const mine=g.players.find(p=>p.id===me);for(const c of mine.hand||[]){let b=document.createElement('button');b.className='card '+(c.color||'wild')+(c.type!=='number'?' special':'');b.innerHTML=cardArt(c);b.disabled=active.id!==me;b.onclick=()=>{let chosen=c.color||color();if(chosen)send({type:'play',cardId:c.id,color:chosen})};$('hand').append(b);}$('actions').innerHTML='';if(active.id===me){if(g.phase==='swap'){for(const p of g.players.filter(p=>p.id!==me&&!p.out)){let b=document.createElement('button');b.textContent='Swap with '+p.name;b.onclick=()=>send({type:'swap',target:p.id});$('actions').append(b);}}else if(g.phase==='roulette'){for(const c of ['red','yellow','green','blue']){let b=document.createElement('button');b.textContent=c;b.onclick=()=>send({type:'color',color:c});$('actions').append(b);}}else{let b=document.createElement('button');b.textContent=g.pending?'Take penalty':'Draw until playable';b.onclick=()=>send({type:'draw'});$('actions').append(b);}}});</script></body></html>
